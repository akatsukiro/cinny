name: Sync Fork with Upstream (Rebase)

# Controls when the action will run.
on:
  # Runs on a schedule (every 6 hours). You can adjust the cron schedule as needed.
  schedule:
    - cron: '0 18 * * *'

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the fork's code
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0
      # 2. Generate a token from the GitHub App
      - name: Generate GitHub App Token
        id: get_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}
      # 3. Set up Git configuration
      - name: Set up Git
        run: |
          git config --global user.name "krishukr[bot]"
          git config --global user.email "krishukr[bot]@users.noreply.github.com"
      # 4. Perform the sync and rebase
      - name: Sync Fork
        run: |
          # Add the upstream repository remote
          git remote add upstream https://github.com/cinnyapp/cinny.git

          # Fetch all branches from upstream
          git fetch upstream

          # Determine the default branch of the fork
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)

          # Determine the default branch of the upstream repository
          UPSTREAM_DEFAULT_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)

          # Rebase the fork's default branch with the upstream's default branch
          echo "Rebasing local '$DEFAULT_BRANCH' with 'upstream/$UPSTREAM_DEFAULT_BRANCH'..."
          git rebase "upstream/$UPSTREAM_DEFAULT_BRANCH"

          # Force push the rebased branch to the fork
          echo "Pushing changes to origin..."
          git push origin "$DEFAULT_BRANCH" --force
        env:
          # Use the generated token for authentication
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
